<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call of Duty: WWII | XBOX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo"><img src="img/xbox.svg" alt=""></div>
            <nav>
                <ul class="nav-links">
                    <li><a href="#">Games</a></li>
                    <li><a href="#">Consoles</a></li>
                    <li><a href="#">Community</a></li>
                </ul>
                <div class="search">
                    <input type="text" placeholder="Search">
                </div>
            </nav>
        </div>
    </header>

    <main class="game-page">
        <div class="container">
            <div class="game-header">
                <h1>Call of Duty: WWII</h1>
                <p class="release-date">Released on: 23/11/2022</p>
                <div class="game-actions">
                    <button class="btn-primary">Order Now</button>
                    <button class="btn-secondary">More Games</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
